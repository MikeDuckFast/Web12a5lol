<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>12A5 - Quyết Tâm Đỗ Nguyện Vọng 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
    body { font-family: 'Quicksand', sans-serif; overflow-x: hidden; }
    #wish-message { font-family: 'Dancing Script', cursive; }
    .wish-title { font-family: 'Dancing Script', cursive; }

    /* KHÔI PHỤC LOGO SHINE CỦA BẠN */
    .logo {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff6a0, #ffd700, #ffae00, #ffd700);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.6), 0 0 15px rgba(255, 140, 0, 0.4);
      animation: logoShine 4s linear infinite;
      transition: 0.3s;
    }
    @keyframes logoShine { 0% { background-position: 0% } 100% { background-position: 200% } }

    /* HIỆU ỨNG CHỮ GIỮA */
    .animate-glow {
      background: linear-gradient(90deg, #4facfe, #00f2fe, #facc15, #4facfe);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .fade-in-up { animation: fadeInUp 1s ease-out forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .petal {
      position: fixed;
      top: -40px;
      font-size: 20px;
      z-index: 9999;
      pointer-events: none;
      animation: fall linear infinite;
      user-select: none;
    }
    @keyframes fall {
      0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 15px;
      border-radius: 20px;
      min-width: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
</style>
</head>

<body class="bg-zinc-900 text-gray-100">
<header class="bg-blue-800 text-white px-6 py-4 shadow-2xl border-b-2 border-yellow-500 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <h1 class="logo cursor-pointer text-center md:text-left" onclick="showSection('home')">
      ⚜ Lớp 12A5 - Rạch Kiến
    </h1>
    <div class="flex justify-between items-center text-[11px] md:text-sm font-bold w-full max-w-md mx-auto">
      <button onclick="showSection('home')" class="hover:text-yellow-300 transition">🏠 Trang chủ</button>
      <button onclick="showSection('gallery')" class="hover:text-yellow-300 transition">📸 Ảnh lớp</button>
      <button onclick="showSection('events')" class="hover:text-yellow-300 transition">🎗️ Kỷ niệm</button>
      <button onclick="showSection('students')" class="hover:text-yellow-300 transition">👩‍🎓 Học sinh</button>
    </div>
  </div>
</header>

<main class="px-4 md:px-8 max-w-7xl mx-auto min-h-screen">

        SẴN SÀNG CHO KỲ THI 2026
      </h2>
      
      <div class="flex justify-center flex-wrap gap-4 md:gap-8 mb-12">

          <span id="days" class="text-3xl md:text-5xl font-bold text-yellow-400">00</span>
          <span class="text-[10px] md:text-xs uppercase mt-1 font-bold text-gray-400">Ngày</span>
        </div>
        <div class="countdown-item">
          <span id="hours" class="text-3xl md:text-5xl font-bold text-yellow-400">00</span>
          <span class="text-[10px] md:text-xs uppercase mt-1 font-bold text-gray-400">Giờ</span>
        </div>
        <div class="countdown-item">
          <span id="minutes" class="text-3xl md:text-5xl font-bold text-yellow-400">00</span>
          <span class="text-[10px] md:text-xs uppercase mt-1 font-bold text-gray-400">Phút</span>
        </div>
        <div class="countdown-item">
          <span id="seconds" class="text-3xl md:text-5xl font-bold text-yellow-400">00</span>
          <span class="text-[10px] md:text-xs uppercase mt-1 font-bold text-gray-400">Giây</span>
        </div>
      </div>
