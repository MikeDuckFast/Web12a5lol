<style>
    body { font-family: 'Quicksand', sans-serif; overflow-x: hidden; }
    #wish-message { font-family: 'Dancing Script', cursive; }
    .wish-title { font-family: 'Dancing Script', cursive; }

    /* Hiệu ứng tiêu đề lấp lánh */
    .animate-glow {
      background: linear-gradient(90deg, #ff4d4d, #facc15, #ff4d4d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Hiệu ứng hiện hình */
    .fade-in-up { animation: fadeInUp 1s ease-out forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  /* Hiệu ứng bao lì xì rơi */
.petal {
  position: fixed;
  top: -40px;
  font-size: 24px;
  z-index: 9999;
  pointer-events: none;
  animation: fall linear infinite;
  user-select: none;
}

    @keyframes fall {
      0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  /* Logo nổi bật */
.logo {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(90deg, #fff6a0, #ffd700, #ffae00, #ffd700);
  background-size: 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 
      0 0 5px rgba(255, 215, 0, 0.6),
      0 0 15px rgba(255, 140, 0, 0.4);
  animation: logoShine 4s linear infinite;
  transition: 0.3s;
}

.logo:hover {
  transform: scale(1.05);
}

@keyframes logoShine {
  0% { background-position: 0% }
  100% { background-position: 200% }
}

<div id="imageModal" 
     class="fixed inset-0 z-[100] bg-black/95 hidden flex items-center justify-center p-4 cursor-zoom-out" 
     onclick="closeModal()">
  <button class="absolute top-5 right-5 text-white text-4xl">&times;</button>

<script>
  /* === HÀM PHÓNG TO ẢNH === */
  function openModal(src) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modalImg.src = src;
    modal.classList.remove('hidden');
    setTimeout(() => {
      modalImg.classList.remove('scale-95');
      modalImg.classList.add('scale-100');
    }, 10);
  }

  function closeModal() {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modalImg.classList.add('scale-95');
    modal.classList.add('hidden');
  }

  /* === CÁC LOGIC KHÁC (Firebase, showSection, hoa rơi...) giữ nguyên như cũ của bạn === */
  function showSection(name) {
    const sections = ['home', 'students', 'gallery', 'events'];
    sections.forEach(s => {
      const el = document.getElementById("section-" + s);
      if (el) {
        if (s === name) {
          el.classList.remove("hidden");
          if (name === 'home') {
            const content = document.getElementById("home-content");
            content.classList.remove("fade-in-up");
            void content.offsetWidth;
            content.classList.add("fade-in-up");
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          el.classList.add("hidden");
        }
      }
    });
  }

  function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'petal';

  // Gán icon bao lì xì
  petal.innerHTML = "🧧";

  // Random kích thước
  const size = Math.random() * 20 + 20; // 20px → 40px
  petal.style.fontSize = size + "px";

  // Random vị trí ngang
  petal.style.left = Math.random() * 100 + "vw";

  // Random tốc độ rơi
  petal.style.animationDuration = Math.random() * 3 + 4 + "s";

  document.body.appendChild(petal);

  setTimeout(() => {
    petal.remove();
  }, 7000);
}
