<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lớp A5 - THPT Rạch Kiến</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
    body { font-family: 'Quicksand', sans-serif; overflow-x: hidden; }
    #wish-message { font-family: 'Dancing Script', cursive; }
    .wish-title { font-family: 'Montserrat', sans-serif; }

    /* Hiệu ứng tiêu đề lấp lánh */
    .animate-glow {
      background: linear-gradient(90deg, #ff4d4d, #facc15, #ff4d4d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Hiệu ứng hiện hình */
    .fade-in-up { animation: fadeInUp 1s ease-out forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FIX: Hiệu ứng hoa rơi chuẩn */
    .petal {
      position: fixed; /* Đổi sang fixed để không bị lệch khi cuộn trang */
      top: -10px;
      background-color: #ffeb3b; 
      border-radius: 150% 0 150% 0;
      opacity: 0.8; 
      z-index: 9999; /* Đảm bảo nằm trên cùng */
      pointer-events: none; 
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body class="bg-zinc-900 text-gray-100">

<header class="bg-red-700 text-white p-4 flex justify-between items-center shadow-2xl border-b-2 border-yellow-500 sticky top-0 z-50">
  <h1 class="text-xl font-bold cursor-pointer flex items-center gap-2" onclick="showSection('home')">
    <span>🧧</span> Lớp A5 - Rạch Kiến
  </h1>
  <button id="loginBtn" class="text-sm bg-orange-500 hover:bg-yellow-400 text-blue-900 px-4 py-1.5 rounded-full font-bold transition-all">
    Đăng nhập
  </button>
</header>

<nav class="bg-orange-600 shadow-lg sticky top-[64px] z-40">
  <div class="max-w-6xl mx-auto flex justify-around py-3 text-xs md:text-sm font-bold">
    <button onclick="showSection('home')" class="hover:text-yellow-200 transition">🏠 TRANG CHỦ</button>
    <button onclick="showSection('students')" class="hover:text-yellow-200 transition">👩‍🎓 HỌC SINH</button>
    <button onclick="showSection('gallery')" class="hover:text-yellow-200 transition">📸 ẢNH LỚP</button>
    <button onclick="showSection('events')" class="hover:text-yellow-200 transition">📅 SỰ KIỆN</button>
  </div>
</nav>

<main class="p-4 max-w-6xl mx-auto min-h-screen">
  <section id="section-home" class="py-12 text-center flex flex-col justify-center min-h-[60vh]">
    <div id="home-content" class="fade-in-up">
      <div class="text-6xl mb-6">🧧</div>
      <h2 class="wish-title animate-glow text-4xl md:text-7xl font-black mb-8 uppercase px-2">
        Chúc Mừng Năm Mới 2026
      </h2>
      <div class="max-w-3xl mx-auto bg-red-900/40 backdrop-blur-md p-8 rounded-[2rem] border-2 border-yellow-600/50 shadow-2xl mb-10 mx-4">
        <p id="wish-message" class="text-2xl md:text-4xl text-yellow-400 leading-relaxed">
          "Chúc bạn một năm mới vạn sự như ý, học tập bứt phá, luôn tràn đầy niềm vui!"
        </p>
      </div>
      
    </div>
  </section>

  <section id="section-students" class="hidden">
    <h2 class="text-2xl font-bold mb-6 text-yellow-500 border-b border-yellow-500/30 pb-2">👩‍🎓 Danh sách học sinh</h2>
    <div id="studentList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </section>

  <section id="section-gallery" class="hidden">
    <h2 class="text-2xl font-bold mb-6 text-yellow-500 border-b border-yellow-500/30 pb-2">📸 Khoảnh khắc A5</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <img src="anh1.jpg" class="rounded-xl shadow-lg border-2 border-red-800 w-full h-64 object-cover" alt="Ảnh 1">
      
    </div>
  </section>

  <section id="section-events" class="hidden">
  <h2 class="text-2xl font-bold mb-6 text-yellow-500 border-b border-yellow-500/30 pb-2">
    📅 Sự kiện nổi bật
  </h2>
  <!-- Khối chữ mô tả -->
  <div class="bg-red-900/20 p-6 rounded-2xl border border-yellow-600/30 max-w-3xl mx-auto">
    <h3 class="text-2xl font-bold text-yellow-400 text-center">
      Hội Xuân 2026
    </h3>
    <p class="text-gray-300 mt-3 text-center">
      Menu hội xuân của lớp 12A5 chúng mình nè.
    </p>
  </div>
  <!-- Khối ảnh menu RIÊNG -->
  <div class="mt-10 flex justify-center">
    <img 
      src="menu.png" 
      alt="Menu Hội Xuân 2026"
      class="w-full max-w-4xl rounded-2xl shadow-2xl border-4 border-yellow-600 hover:scale-105 transition-transform duration-300"
    >
  </div>
</section>

</main>

<footer class="bg-black/50 text-yellow-600 text-center p-8 mt-10 border-t border-yellow-900/30">
  © 2026 - Lớp A5 THPT Rạch Kiến
</footer>

<script>
/* ================= FIREBASE (Tạm để đó) ================= */
const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* === LOGIC ĐIỀU HƯỚNG (Đã fix lỗi lồng thẻ script) === */
function showSection(name) {
  const sections = ['home', 'students', 'gallery', 'events'];
  sections.forEach(s => {
    const el = document.getElementById("section-" + s);
    if (el) {
      if (s === name) {
        el.classList.remove("hidden");
        if (name === 'home') {
          const content = document.getElementById("home-content");
          content.classList.remove("fade-in-up");
          void content.offsetWidth;
          content.classList.add("fade-in-up");
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        el.classList.add("hidden");
      }
    }
  });
}

/* === HIỆU ỨNG HOA MAI RƠI === */
function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'petal';
  const size = Math.random() * 10 + 8 + 'px';
  petal.style.width = size;
  petal.style.height = size;
  petal.style.left = Math.random() * 100 + 'vw';
  petal.style.animationDuration = Math.random() * 3 + 4 + 's';
  document.body.appendChild(petal);
  setTimeout(() => { petal.remove(); }, 7000);
}
setInterval(createPetal, 400);
</script>
</html>
