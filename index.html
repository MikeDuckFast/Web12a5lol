<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lớp A5 - THPT Rạch Kiến</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <style>
  /* Hiệu ứng hiện ra mượt mà */
  .fade-in-up {
    animation: fadeInUp 1.5s ease-out forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Hiệu ứng chữ lấp lánh cho câu chúc */
  .wish-text {
    background: linear-gradient(90deg, #ff0000, #ffcc00, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }
</style>
  <style>
  /* Font chữ cho câu chúc - Dùng font Dancing Script cực đẹp cho lời chúc */
  #wish-message {
    font-family: 'Dancing Script', cursive;
  }
  
  /* Font cho tiêu đề chính */
  .wish-title {
    font-family: 'Montserrat', sans-serif;
    letter-spacing: -1px;
  }

  /* Hiệu ứng mượt mà */
  .fade-in-up {
    animation: fadeInUp 1.2s ease-out forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>

<body class="bg-zinc-900 text-gray-100 font-[Quicksand]">

<header class="bg-red-700 text-white p-4 flex justify-between items-center shadow-2xl border-b-2 border-yellow-500">
  <h1 class="text-xl font-bold cursor-pointer flex items-center gap-2" onclick="showSection('home')">
    <span>🧧</span> Lớp A5 - Rạch Kiến
  </h1>
  <button id="loginBtn" class="text-sm bg-yellow-500 hover:bg-yellow-400 text-red-900 px-4 py-1.5 rounded-full font-bold transition-all">
    Đăng nhập
  </button>
</header>

<nav class="bg-orange-600 shadow-lg overflow-x-auto">
  <div class="max-w-6xl mx-auto flex justify-around py-3 text-xs md:text-sm font-bold whitespace-nowrap">
    <button onclick="showSection('home')" class="text-white hover:text-yellow-200 px-4">🏠 Trang chủ</button>
    <button onclick="showSection('students')" class="text-white hover:text-yellow-200 px-4">👩‍🎓 Học sinh</button>
    <button onclick="showSection('gallery')"  class="text-white hover:text-yellow-200 px-4">📸 Ảnh lớp</button>
    <button onclick="showSection('events')"   class="text-white hover:text-yellow-200 px-4">📅 Sự kiện</button>
  </div>
</nav>

<main class="p-4 max-w-6xl mx-auto">
  <section id="section-home" class="py-12 text-center min-h-[70vh] flex flex-col justify-center">
    <div id="home-content" class="fade-in-up">
      <div class="text-6xl mb-6">🧧</div>
      
      <h2 class="wish-title text-4xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-red-500 mb-8 uppercase">
        Chúc Mừng Năm Mới 2026
      </h2>

      <div class="max-w-3xl mx-auto bg-red-900/30 backdrop-blur-sm p-8 rounded-[2rem] border-2 border-yellow-600/50 shadow-[0_0_30px_rgba(234,179,8,0.2)] mb-10">
        <p id="wish-message" class="text-2xl md:text-4xl text-yellow-400 leading-relaxed">
          "Chúc tập thể lớp A5 một năm mới vạn sự như ý, học tập bứt phá, luôn tràn đầy niềm vui!"
        </p>
      </div>

      <div class="flex flex-wrap justify-center gap-6">
        <button onclick="showSection('students')" class="bg-red-600 hover:bg-red-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105">
          👨‍👩‍👧‍👦 Danh sách lớp
        </button>
        <button onclick="showSection('gallery')" class="bg-yellow-600 hover:bg-yellow-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105">
          📷 Ảnh kỷ niệm
        </button>
      </div>
    </div>
  </section>
  
  </main>

<!-- FOOTER -->
<footer class="bg-blue-600 text-white text-center p-3 mt-10">
  © 2026 - Lớp A5 THPT Rạch Kiến
</footer>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ================= AUTH ================= */
const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async () => {
  const email = prompt("Email Admin:");
  const password = prompt("Mật khẩu:");
  await auth.signInWithEmailAndPassword(email, password);
};

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("addStudentBtn").classList.remove("hidden");
    document.getElementById("uploadBtn").classList.remove("hidden");
    document.getElementById("addEventBtn").classList.remove("hidden");
    loginBtn.textContent = "Đã đăng nhập";
  }
});

/* ================= STUDENTS ================= */
const studentList = document.getElementById("studentList");

db.collection("students").onSnapshot(snapshot => {
  studentList.innerHTML = "";
  snapshot.forEach(doc => {
    const div = document.createElement("div");
    div.className = "bg-white p-2 rounded shadow text-center";
    div.textContent = doc.data().name;
    studentList.appendChild(div);
  });
});

document.getElementById("addStudentBtn").onclick = async () => {
  const name = prompt("Tên học sinh:");
  if (name) {
    await db.collection("students").add({ name });
  }
};

/* ================= GALLERY ================= */
const uploadBtn = document.getElementById("uploadBtn");
const uploadInput = document.getElementById("uploadImage");

uploadBtn.onclick = () => uploadInput.click();

uploadInput.onchange = async (e) => {
  const file = e.target.files[0];
  const ref = storage.ref("gallery/" + file.name);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection("gallery").add({ url });
};

db.collection("gallery").onSnapshot(snapshot => {
  document.getElementById("gallery").innerHTML = "";
  snapshot.forEach(doc => {
    const img = document.createElement("img");
    img.src = doc.data().url;
    img.className = "rounded shadow";
    document.getElementById("gallery").appendChild(img);
  });
});

/* ================= EVENTS ================= */
db.collection("events").onSnapshot(snapshot => {
  const eventsDiv = document.getElementById("events");
  eventsDiv.innerHTML = "";
  snapshot.forEach(doc => {
    const e = doc.data();
    eventsDiv.innerHTML += `
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">${e.title}</h3>
        <p class="mt-2">${e.content}</p>
      </div>
    `;
  });
});

document.getElementById("addEventBtn").onclick = async () => {
  const title = prompt("Tiêu đề:");
  const content = prompt("Nội dung:");
  if (title && content) {
    await db.collection("events").add({ title, content });
  }
};
</script>
<script>
function showSection(name) {
  const sections = ['home', 'students', 'gallery', 'events'];
  
  sections.forEach(s => {
    const element = document.getElementById("section-" + s);
    if (s === name) {
      element.classList.remove("hidden");
      
      // Nếu là trang chủ, reset lại animation
      if (name === 'home') {
        const content = document.getElementById("home-content");
        content.classList.remove("fade-in-up");
        void content.offsetWidth; // Thủ thuật để trình duyệt hiểu là cần chạy lại animation
        content.classList.add("fade-in-up");
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      element.classList.add("hidden");
    }
  });
}
</script>
</body>
</html>
