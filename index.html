<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lớp A5 - THPT Rạch Kiến</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="s_Q5mfJ4zBjllbnOJIIHzDSH5w6d-5AHdIcGBldB7pg" />
  <meta name="google-site-verification" content="CpG9_qfQiYo8pD1cZ02kO-kbzpZFA871jXnOxBAtiM0" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <style>
  /* Hiệu ứng hiện ra mượt mà */
  .fade-in-up {
    animation: fadeInUp 1.5s ease-out forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Hiệu ứng chữ lấp lánh cho câu chúc */
  .wish-text {
    background: linear-gradient(90deg, #ff0000, #ffcc00, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }
</style>
</head>

<body class="bg-blue-50 text-gray-800">

<!-- HEADER -->
<header class="bg-blue-600 text-white p-4 flex justify-between items-center">
  <!-- MENU ĐIỀU HƯỚNG -->
<nav class="bg-white shadow-sm">
  <div class="max-w-6xl mx-auto flex justify-around py-2 text-sm font-medium">
    <button onclick="showSection('students')" class="text-blue-600">👩‍🎓 Học sinh</button>
    <button onclick="showSection('gallery')"  class="text-blue-600">📸 Ảnh lớp</button>
    <button onclick="showSection('events')"   class="text-blue-600">📅 Sự kiện</button>
  </div>
</nav>

  <h1 class="text-xl font-bold">Lớp A5 - THPT Rạch Kiến</h1>
  <button id="loginBtn" class="text-sm bg-white text-blue-600 px-3 py-1 rounded">
    Đăng nhập
  </button>
</header>

<header class="bg-red-600 text-white p-4 flex justify-between items-center shadow-lg">
  <h1 class="text-xl font-bold cursor-pointer" onclick="showSection('home')">🧧 Lớp A5 - Rạch Kiến</h1>
  <button id="loginBtn" class="text-sm bg-white text-red-600 px-3 py-1 rounded-full font-semibold">
    Đăng nhập
  </button>
</header>

<nav class="bg-yellow-100 shadow-md border-b border-yellow-200">
  <div class="max-w-6xl mx-auto flex justify-around py-3 text-sm font-bold">
    <button onclick="showSection('home')" class="text-red-700 hover:text-red-500 flex flex-col items-center">🏠 <span>Trang chủ</span></button>
    <button onclick="showSection('students')" class="text-red-700 hover:text-red-500 flex flex-col items-center">👩‍🎓 <span>Học sinh</span></button>
    <button onclick="showSection('gallery')"  class="text-red-700 hover:text-red-500 flex flex-col items-center">📸 <span>Ảnh lớp</span></button>
    <button onclick="showSection('events')"   class="text-red-700 hover:text-red-500 flex flex-col items-center">📅 <span>Sự kiện</span></button>
  </div>
</nav>

<main class="p-4 max-w-6xl mx-auto">

  <section id="section-home" class="py-10 text-center">
  <div id="home-content" class="fade-in-up">
    <div class="text-6xl mb-4">🧧</div>
    
    <h2 class="text-3xl md:text-5xl font-black mb-6 px-4">
      <span class="wish-text uppercase">Chúc Mừng Năm Mới 2026</span>
    </h2>

    <div class="max-w-2xl mx-auto bg-white/80 p-6 rounded-3xl shadow-xl border-2 border-red-500 mx-4">
      <p id="wish-message" class="text-xl md:text-2xl text-red-700 font-serif italic leading-relaxed">
        "Chúc tập thể lớp A5 một năm mới vạn sự như ý, <br> 
        học tập bứt phá, luôn tràn đầy niềm vui!"
      </p>
    </div>

    <div class="flex flex-wrap justify-center gap-4 mt-10">
      <button onclick="showSection('students')" class="bg-red-600 hover:scale-105 transition-transform text-white font-bold py-3 px-6 rounded-full shadow-lg">
        👩‍🎓 Danh sách lớp
      </button>
      <button onclick="showSection('gallery')" class="bg-yellow-500 hover:scale-105 transition-transform text-white font-bold py-3 px-6 rounded-full shadow-lg">
        📸 Ảnh kỷ niệm
      </button>
    </div>
  </div>
</section>

  <section id="section-students" class="hidden">
    <h2 class="text-2xl font-semibold mb-3 border-b-2 border-red-500 pb-2">👩‍🎓👨‍🎓 Danh sách học sinh</h2>
    <div id="studentList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mt-4"></div>
    <button id="addStudentBtn" class="hidden mt-6 bg-red-600 text-white px-4 py-2 rounded shadow">
      ➕ Thêm học sinh
    </button>
  </section>

  <section id="section-gallery" class="hidden">
     </section>

  <section id="section-events" class="hidden">
     </section>

</main>


<!-- FOOTER -->
<footer class="bg-blue-600 text-white text-center p-3 mt-10">
  © 2026 - Lớp A5 THPT Rạch Kiến
</footer>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ================= AUTH ================= */
const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async () => {
  const email = prompt("Email Admin:");
  const password = prompt("Mật khẩu:");
  await auth.signInWithEmailAndPassword(email, password);
};

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("addStudentBtn").classList.remove("hidden");
    document.getElementById("uploadBtn").classList.remove("hidden");
    document.getElementById("addEventBtn").classList.remove("hidden");
    loginBtn.textContent = "Đã đăng nhập";
  }
});

/* ================= STUDENTS ================= */
const studentList = document.getElementById("studentList");

db.collection("students").onSnapshot(snapshot => {
  studentList.innerHTML = "";
  snapshot.forEach(doc => {
    const div = document.createElement("div");
    div.className = "bg-white p-2 rounded shadow text-center";
    div.textContent = doc.data().name;
    studentList.appendChild(div);
  });
});

document.getElementById("addStudentBtn").onclick = async () => {
  const name = prompt("Tên học sinh:");
  if (name) {
    await db.collection("students").add({ name });
  }
};

/* ================= GALLERY ================= */
const uploadBtn = document.getElementById("uploadBtn");
const uploadInput = document.getElementById("uploadImage");

uploadBtn.onclick = () => uploadInput.click();

uploadInput.onchange = async (e) => {
  const file = e.target.files[0];
  const ref = storage.ref("gallery/" + file.name);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection("gallery").add({ url });
};

db.collection("gallery").onSnapshot(snapshot => {
  document.getElementById("gallery").innerHTML = "";
  snapshot.forEach(doc => {
    const img = document.createElement("img");
    img.src = doc.data().url;
    img.className = "rounded shadow";
    document.getElementById("gallery").appendChild(img);
  });
});

/* ================= EVENTS ================= */
db.collection("events").onSnapshot(snapshot => {
  const eventsDiv = document.getElementById("events");
  eventsDiv.innerHTML = "";
  snapshot.forEach(doc => {
    const e = doc.data();
    eventsDiv.innerHTML += `
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">${e.title}</h3>
        <p class="mt-2">${e.content}</p>
      </div>
    `;
  });
});

document.getElementById("addEventBtn").onclick = async () => {
  const title = prompt("Tiêu đề:");
  const content = prompt("Nội dung:");
  if (title && content) {
    await db.collection("events").add({ title, content });
  }
};
</script>
<script>
function showSection(name) {
  const sections = ['home', 'students', 'gallery', 'events'];
  
  sections.forEach(s => {
    const element = document.getElementById("section-" + s);
    if (s === name) {
      element.classList.remove("hidden");
      
      // Nếu là trang chủ, reset lại animation
      if (name === 'home') {
        const content = document.getElementById("home-content");
        content.classList.remove("fade-in-up");
        void content.offsetWidth; // Thủ thuật để trình duyệt hiểu là cần chạy lại animation
        content.classList.add("fade-in-up");
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      element.classList.add("hidden");
    }
  });
}
</script>
</body>
</html>
