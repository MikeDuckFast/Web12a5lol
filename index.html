<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lớp A5 - THPT Rạch Kiến</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="s_Q5mfJ4zBjllbnOJIIHzDSH5w6d-5AHdIcGBldB7pg" />
  <meta name="google-site-verification" content="CpG9_qfQiYo8pD1cZ02kO-kbzpZFA871jXnOxBAtiM0" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>

<body class="bg-blue-50 text-gray-800">

<!-- HEADER -->
<header class="bg-blue-600 text-white p-4 flex justify-between items-center">
  <!-- MENU ĐIỀU HƯỚNG -->
<nav class="bg-white shadow-sm">
  <div class="max-w-6xl mx-auto flex justify-around py-2 text-sm font-medium">
    <button onclick="showSection('students')" class="text-blue-600">👩‍🎓 Học sinh</button>
    <button onclick="showSection('gallery')"  class="text-blue-600">📸 Ảnh lớp</button>
    <button onclick="showSection('events')"   class="text-blue-600">📅 Sự kiện</button>
  </div>
</nav>

  <h1 class="text-xl font-bold">Lớp A5 - THPT Rạch Kiến</h1>
  <button id="loginBtn" class="text-sm bg-white text-blue-600 px-3 py-1 rounded">
    Đăng nhập
  </button>
</header>

<main class="p-4 space-y-10 max-w-6xl mx-auto">

  <!-- STUDENT LIST -->
  <section id="section-students">
    <h2 class="text-2xl font-semibold mb-3">👩‍🎓👨‍🎓 Danh sách học sinh</h2>
    <div id="studentList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3"></div>
    <button id="addStudentBtn" class="hidden mt-3 bg-blue-600 text-white px-4 py-2 rounded">
      ➕ Thêm học sinh
    </button>
  </section>

  <!-- GALLERY -->
  <section id="section-gallery" class="hidden">
    <h2 class="text-2xl font-semibold mb-3">📸 Ảnh lớp</h2>

    <!-- Ảnh lớp giới thiệu -->
    <img src="class.jpg"
         class="w-full rounded-xl shadow mb-4"
         alt="Ảnh lớp A5">

    <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <input type="file" id="uploadImage" class="hidden" />
    <button id="uploadBtn" class="hidden mt-3 bg-blue-600 text-white px-4 py-2 rounded">
      📤 Tải ảnh lên
    </button>
  </section>

  <!-- EVENTS -->
  <section id="section-events" class="hidden">
    <h2 class="text-2xl font-semibold mb-3">📅 Sự kiện / Menu</h2>

    <!-- MENU ĐỒ ĂN -->
    <img src="menu.jpg"
         class="w-full max-w-2xl mx-auto rounded-xl shadow mb-6"
         alt="Menu đồ ăn">

    <div id="events" class="space-y-4"></div>

    <button id="addEventBtn" class="hidden mt-3 bg-blue-600 text-white px-4 py-2 rounded">
      ➕ Thêm sự kiện
    </button>
  </section>

</main>


<!-- FOOTER -->
<footer class="bg-blue-600 text-white text-center p-3 mt-10">
  © 2026 - Lớp A5 THPT Rạch Kiến
</footer>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ================= AUTH ================= */
const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async () => {
  const email = prompt("Email Admin:");
  const password = prompt("Mật khẩu:");
  await auth.signInWithEmailAndPassword(email, password);
};

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("addStudentBtn").classList.remove("hidden");
    document.getElementById("uploadBtn").classList.remove("hidden");
    document.getElementById("addEventBtn").classList.remove("hidden");
    loginBtn.textContent = "Đã đăng nhập";
  }
});

/* ================= STUDENTS ================= */
const studentList = document.getElementById("studentList");

db.collection("students").onSnapshot(snapshot => {
  studentList.innerHTML = "";
  snapshot.forEach(doc => {
    const div = document.createElement("div");
    div.className = "bg-white p-2 rounded shadow text-center";
    div.textContent = doc.data().name;
    studentList.appendChild(div);
  });
});

document.getElementById("addStudentBtn").onclick = async () => {
  const name = prompt("Tên học sinh:");
  if (name) {
    await db.collection("students").add({ name });
  }
};

/* ================= GALLERY ================= */
const uploadBtn = document.getElementById("uploadBtn");
const uploadInput = document.getElementById("uploadImage");

uploadBtn.onclick = () => uploadInput.click();

uploadInput.onchange = async (e) => {
  const file = e.target.files[0];
  const ref = storage.ref("gallery/" + file.name);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection("gallery").add({ url });
};

db.collection("gallery").onSnapshot(snapshot => {
  document.getElementById("gallery").innerHTML = "";
  snapshot.forEach(doc => {
    const img = document.createElement("img");
    img.src = doc.data().url;
    img.className = "rounded shadow";
    document.getElementById("gallery").appendChild(img);
  });
});

/* ================= EVENTS ================= */
db.collection("events").onSnapshot(snapshot => {
  const eventsDiv = document.getElementById("events");
  eventsDiv.innerHTML = "";
  snapshot.forEach(doc => {
    const e = doc.data();
    eventsDiv.innerHTML += `
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">${e.title}</h3>
        <p class="mt-2">${e.content}</p>
      </div>
    `;
  });
});

document.getElementById("addEventBtn").onclick = async () => {
  const title = prompt("Tiêu đề:");
  const content = prompt("Nội dung:");
  if (title && content) {
    await db.collection("events").add({ title, content });
  }
};
</script>
<script>
function showSection(name) {
  document.getElementById("section-students").classList.add("hidden");
  document.getElementById("section-gallery").classList.add("hidden");
  document.getElementById("section-events").classList.add("hidden");

  document.getElementById("section-" + name).classList.remove("hidden");
}
</script>
</body>
</html>
